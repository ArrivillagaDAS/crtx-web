<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>Administración — CMDB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <script type="module" src="../js/admin.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./index.html"><span class="brand-mark">C</span><span><strong>CMDB</strong><small>CARLOS MOVIES DATA BASE</small></span></a>
      <nav class="main-nav"><a href="./index.html">Ver archivo</a></nav>
      <div class="header-actions">
        <span class="admin-label">PANEL DE ADMINISTRACIÓN</span>
        <button class="button button-quiet" id="logout-button">Cerrar sesión</button>
      </div>
    </header>
    <main class="admin-main">
      <div class="section-heading">
        <div>
          <p class="eyebrow">GESTIÓN DEL ARCHIVO</p>
          <h1>Control de <em>calidad</em></h1>
        </div>
        <span id="pending-count" class="status-pill">— pendientes</span>
      </div>
      <div id="admin-alert" class="alert hidden" role="alert"></div>
      <div class="admin-tabs">
        <button class="admin-tab active" data-admin-tab="pending">Propuestas</button>
        <button class="admin-tab" data-admin-tab="categories">Categorías</button>
      </div>

      <section id="admin-pending" class="admin-panel">
        <div class="admin-list" id="pending-list">
          <div class="loading-state">Cargando propuestas…</div>
        </div>
      </section>

      <section id="admin-categories" class="admin-panel hidden">
        <form id="category-form" class="admin-toolbar">
          <label>Nueva categoría
            <input name="categoryName" required minlength="1" maxlength="80" placeholder="Ej. Anime" />
          </label>
          <button class="button button-primary" type="submit">Añadir categoría</button>
        </form>
        <div class="admin-list" id="category-list">
          <div class="loading-state">Cargando categorías…</div>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <span>© <span data-year></span> CMDB</span>
      <a class="text-link" href="./index.html">Volver al archivo ↑</a>
    </footer>
  </body>
</html>
