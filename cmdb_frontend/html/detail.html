<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>Detalle — CMDB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <script type="module" src="../js/detail.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./index.html"><span class="brand-mark">C</span><span><strong>CMDB</strong><small>CARLOS MOVIES DATA BASE</small></span></a>
      <nav class="main-nav">
        <a href="./index.html">Explorar</a><a href="./index.html#ranking">Ranking</a>
      </nav>
      <div class="header-actions">
        <a class="button button-quiet" data-auth-link href="./login.html">Iniciar sesión</a>
        <a class="button button-primary" href="./login.html#registro">Únete a CMDB</a>
      </div>
    </header>
    <main class="detail-main">
      <a class="text-link back-link" href="./index.html">← Volver al archivo</a>
      <div class="detail-content" id="detail-content">
        <div class="loading-state">Abriendo ficha…</div>
      </div>
      <section class="review-section">
        <div class="section-heading">
          <div>
            <p class="eyebrow">VOCES DEL ARCHIVO</p>
            <h2>Reseñas de la <em>comunidad</em></h2>
          </div>
          <span id="review-count" class="result-count"></span>
        </div>
        <div class="review-layout">
          <div id="review-list" class="review-list">
            <div class="loading-state">Cargando reseñas…</div>
          </div>
          <div class="review-form-wrapper">
            <p class="form-footnote hidden" id="review-login">
              Para publicar una reseña o votar, <a class="text-link" href="./login.html">inicia sesión</a>.
            </p>
            <form id="review-form" class="review-form form-stack">
              <p class="eyebrow">COMPARTE TU MIRADA</p>
              <h3>Escribe una <em>reseña.</em></h3>
              <label>Título
                <input type="text" name="title" required minlength="1" maxlength="150" placeholder="Una frase que resuma tu opinión" />
                <small data-error-for="title"></small>
              </label>
              <label>Tu calificación
                <select name="rating" required>
                  <option value="">Selecciona una nota</option>
                  <option value="10">10 · Imprescindible</option>
                  <option value="9">9</option>
                  <option value="8">8 · Muy buena</option>
                  <option value="7">7</option>
                  <option value="6">6 · Interesante</option>
                  <option value="5">5</option>
                  <option value="4">4</option>
                  <option value="3">3 · Floja</option>
                  <option value="2">2</option>
                  <option value="1">1 · No la recomiendo</option>
                </select>
                <small data-error-for="rating"></small>
              </label>
              <label>Tu reseña
                <textarea name="comment" required minlength="1" maxlength="500" rows="6" placeholder="¿Qué te hizo sentir? ¿Qué debería saber otro espectador?"></textarea>
                <small data-error-for="comment"></small>
              </label>
              <button class="button button-primary" type="submit">Publicar reseña <span>↗</span></button>
              <div id="review-alert" class="alert hidden" role="alert"></div>
            </form>
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <span>© <span data-year></span> CMDB</span>
      <a class="text-link" href="./index.html">Volver al archivo ↑</a>
    </footer>
  </body>
</html>
